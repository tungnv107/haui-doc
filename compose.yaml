name: haui-doc

services:
  web:
    build: .
    image: haui-doc:local
    container_name: haui-doc
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3003:3003"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: npm_proxy
